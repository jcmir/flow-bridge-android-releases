name: 'Предложить функцию'
description: 'Описание предлагаемого улучшения'
body:
  - type: markdown
    attributes:
      value: 'Не прикладывайте cookies, токены, пароли, приватные данные, содержимое аккаунтов и чувствительные журналы. Используйте неперсональные примеры.'
  - type: input
    id: android
    attributes:
      label: Версия Android
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Производитель и модель устройства
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: versionName и versionCode
      description: 'Например: 0.3.0, build 9. Для функции укажите используемую версию.'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги или сценарий использования
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
